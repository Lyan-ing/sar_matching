[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-sarreg-data"
version = "0.3.0"
description = "Image-only maritime SAR registration proxy dataset generator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.7", "PyYAML>=6.0", "tqdm>=4.65"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sarreg = "sarreg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sarreg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
